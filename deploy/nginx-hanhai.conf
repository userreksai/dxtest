server {
    listen 80;
    listen [::]:80;

    server_name www.yyy301.com;

    return 301 https://www.yyy301.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.yyy301.com;

    root /var/www/canlexiang;
    index index.html;

    ssl_certificate     /var/www/cert.pem;
    ssl_certificate_key /var/www/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /login/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:pem|key|crt|zip)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    access_log /var/log/nginx/canlexiang-access.log;
    error_log  /var/log/nginx/canlexiang-error.log;
}

# Temporary plain-HTTP diagnostic endpoint.
