server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name www.yyy301.com yyy301.com;

    root /var/www/canlexiang/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 302 /login/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:pem|key|crt|zip|tar|gz)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    access_log /var/log/nginx/canlexiang-8080-access.log;
    error_log  /var/log/nginx/canlexiang-8080-error.log;
}
